project:
  type: website
  output-dir: _site

website:
  title: "Ajit Kumar Sorout"
  description: "Physics PhD Student | String Theory • Condensed Matter • Machine Learning"
  
  navbar:
    background: dark
    foreground: light
    logo: images/logo.png  # Optional: add a small logo if desired
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: blog/index.qmd
        text: Blog
      - href: photos.qmd
        text: Photos
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/YOUR_GITHUB_USERNAME
        aria-label: GitHub
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=YOUR_ID
        aria-label: Google Scholar
      - icon: file-earmark-pdf
        href: assets/cv.pdf
        aria-label: CV

  page-footer:
    left: "© 2025 Ajit Kumar Sorout"
    center: "Built with [Quarto](https://quarto.org)"
    right:
      - icon: envelope
        href: mailto:YOUR_EMAIL@umass.edu
      - icon: github
        href: https://github.com/YOUR_GITHUB_USERNAME

  sidebar:
    - id: blog-sidebar
      style: floating
      contents:
        - section: "Topics"
          contents:
            - topics/string-theory.qmd
            - topics/condensed-matter.qmd
            - topics/tensor-networks.qmd
            - topics/machine-learning.qmd

  search: true

format:
  html:
    theme:
      light: [flatly, styles.scss]
      dark: [darkly, styles.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-copy: true
    highlight-style: github
    fontsize: 1.05em
    linestretch: 1.6
    mainfont: "Source Serif Pro"
    monofont: "JetBrains Mono"

# Enable math rendering
execute:
  freeze: auto

# Blog listing configuration
listings:
  - id: blog-listing
    contents: blog/*.qmd
    sort: "date desc"
    type: default
    categories: true
    feed: true

# Metadata defaults for blog posts
metadata-files:
  - _metadata.yml
